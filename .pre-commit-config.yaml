repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: biome
        name: biome (web_sota)
        entry: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/pre-commit-biome.ps1
        language: system
        files: ^web_sota/
        pass_filenames: false
      - id: ascii-only
        name: ascii-only (em dash guard)
        entry: powershell.exe -NoProfile -Command "$m = Select-String -Path (git diff --cached --name-only | Where-Object { $_ -match '\.(ps1|bat|just)$' }) -Pattern [char]0x2014 -ErrorAction SilentlyContinue; if ($m) { Write-Host 'EM DASH found:'; $m | ForEach-Object { $_.Path + ':' + $_.LineNumber }; exit 1 } else { exit 0 }"
        language: system
        pass_filenames: false
