name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    name: Python gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev
      - name: Ruff check
        run: uv run ruff check src/ --quiet
      - name: Ruff format
        run: uv run ruff format src/ --check --quiet
      - name: Pyright
        run: uv run pyright src
      - name: Pytest
        run: uv run pytest tests/ -q

  webapp:
    name: Webapp gates
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web_sota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web_sota/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Biome
        run: npx biome ci src/
      - name: Build
        run: npm run build
