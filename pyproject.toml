[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtfs-mcp"
version = "0.1.0"
description = "FastMCP 3.1.0 compliant GTFS server for transit data"
authors = [
    { name = "Sandra Schilling", email = "sandraschipal@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "aiohttp>=3.8.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.19.0",
    "python-dateutil>=2.8.0",
    "pytz>=2022.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.21.0",
    "aiofiles>=23.1.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "prefab-ui>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
    "ruff>=0.16.0,<0.17",
    "pyright>=1.1.300",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=gtfs_mcp --cov-report=term-missing --cov-fail-under=20"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008", "S106", "S110", "S112", "RUF012", "S603", "S607", "S324", "E402", "E501", "S104", "S105", "RUF013"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
